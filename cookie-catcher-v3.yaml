name: "🍪 Cookie 抓取开关"
description: "按需抓取四站登录 Cookie：哔哩哔哩 / 抖音 / 快手 / 斗鱼。打开「抓取」开关 → 刷 App → 收到通知 → 关闭开关。Cookie 按站点分类保存，在 BoxJs 里查看复制。"
author: "白日梦"

# 唯一的开关：模块设置页里的「抓取」拨动开关
# 开关值直接写入模块环境变量，脚本里用 ctx.env.ENABLE_CAPTURE 读取
# 默认关闭（未拨动时 ctx.env 里没有这个值，脚本按关闭处理）
env_schema:
  ENABLE_CAPTURE:
    name: 抓取
    description: "默认关闭。开启后刷 App 自动抓取各站登录 Cookie，抓到后请关闭。"
    default_value: "false"
    options:
      - "true"
      - "false"

mitm:
  hostnames:
    includes:
      - "api.bilibili.com"
      - "app.bilibili.com"
      - "aweme.snssdk.com"
      - "www.douyin.com"
      - "api.kuaishouzt.com"
      - "www.kuaishou.com"
      - "www.douyu.com"
      - "apiv2.douyu.com"

scriptings:
  - http_request:
      name: "🍪 Cookie 抓取"
      match: '^https?://(api\.bilibili\.com|app\.bilibili\.com|aweme\.snssdk\.com|www\.douyin\.com|api\.kuaishouzt\.com|www\.kuaishou\.com|www\.douyu\.com|apiv2\.douyu\.com)([/:?#]|$)'
      script_url: "https://raw.githubusercontent.com/erleizi/cookie-catcher/main/cookie-catcher-v2.js"
